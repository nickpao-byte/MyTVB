name: Build MyTVB v7a Release APK

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-apk.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v7a branch
        uses: actions/checkout@v5
        with:
          ref: build-v7a

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build optimized 32-bit release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleReleaseRenamed

      - name: Verify release APK
        run: |
          APK="app/build/outputs/renamed_apk/release/MyTVB-v7a-v2.0.3-release.apk"
          echo "APK: $APK"
          ls -lh "$APK"

          echo "Native ABI directories:"
          ABIS=$(unzip -l "$APK" | awk '/lib\/.+\.so$/ {split($4,a,"/"); print a[2]}' | sort -u)
          printf '%s\n' "$ABIS"
          test "$ABIS" = "armeabi-v7a" || { echo "Unexpected ABI set"; exit 1; }

          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          echo "Package info:"
          "$AAPT" dump badging "$APK" | grep '^package:' | head -n 1
          "$AAPT" dump badging "$APK" | grep "name='com.mytvb.v7a'" >/dev/null || { echo "Unexpected package name"; exit 1; }

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: MyTVB-v2.0.3-v7a-release-32bit
          path: app/build/outputs/renamed_apk/release/MyTVB-v7a-v2.0.3-release.apk
          if-no-files-found: error
