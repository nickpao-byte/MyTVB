name: Build MyTVB v7a APK

on:
  push:
    branches:
      - build-v7a
    paths:
      - app/build.gradle.kts
      - .github/workflows/build-apk.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build 32-bit debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebugRenamed

      - name: Verify APK
        run: |
          APK="app/build/outputs/renamed_apk/debug/MyTVB-v7a-v2.0.3-debug.apk"
          echo "APK: $APK"
          ls -lh "$APK"
          echo "Native ABI directories:"
          unzip -l "$APK" | awk '/lib\/.+\.so$/ {split($4,a,"/"); print a[2]}' | sort -u

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: MyTVB-v2.0.3-v7a-32bit
          path: app/build/outputs/renamed_apk/debug/MyTVB-v7a-v2.0.3-debug.apk
          if-no-files-found: error
