name: Build MyTVB v2.0.3 v7a Release - App PlayInfo Fallback

on:
  push:
    branches:
      - build-v7a-app-playinfo-fallback
    paths:
      - app/src/main/java/com/mytvb/network/WbiGenerator.kt
      - app/src/main/java/com/mytvb/network/ua/DesktopUserAgentStore.kt
      - .github/patches/rapid-rebuffer-cdn-fallback.patch
      - .github/patches/http412-playinfo-retry.patch
      - .github/patches/media-http412-fix.patch
      - .github/scripts/apply-native-request-fallback.py
      - .github/scripts/apply-tv-playinfo-fallback.py
      - .github/workflows/build-release-rapid-rebuffer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v7a app PlayInfo fallback branch
        uses: actions/checkout@v5

      - name: Apply Kotlin playback patches
        run: |
          git apply --check .github/patches/rapid-rebuffer-cdn-fallback.patch
          git apply .github/patches/rapid-rebuffer-cdn-fallback.patch
          git apply --check .github/patches/http412-playinfo-retry.patch
          git apply .github/patches/http412-playinfo-retry.patch
          git apply --check .github/patches/media-http412-fix.patch
          git apply .github/patches/media-http412-fix.patch
          python3 .github/scripts/apply-native-request-fallback.py
          python3 .github/scripts/apply-tv-playinfo-fallback.py
          git diff --check

          EXPECTED=$(printf '%s\n' \
            'app/src/main/java/com/mytvb/feature/player/PlaybackFallbackController.kt' \
            'app/src/main/java/com/mytvb/feature/player/VideoPlayerCdnFailoverDataSource.kt' \
            'app/src/main/java/com/mytvb/feature/player/VideoPlayerFragment.kt' \
            'app/src/main/java/com/mytvb/feature/player/VideoPlayerPlayInfoGateway.kt' \
            'app/src/main/java/com/mytvb/feature/player/VideoPlayerViewModel.kt' | sort)
          ACTUAL=$(git diff --name-only | sort)
          echo "Runtime-patched Kotlin files:"
          printf '%s\n' "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Verify direct TV and Android App PlayInfo paths are present
        run: |
          grep -F 'val currentDmParams = if (includeDmParams) buildDmParams() else emptyMap()' app/src/main/java/com/mytvb/network/WbiGenerator.kt
          grep -F 'Chrome 153 is stable in Sep 2026' app/src/main/java/com/mytvb/network/ua/DesktopUserAgentStore.kt
          grep -F 'directOnly=true' app/src/main/java/com/mytvb/feature/player/VideoPlayerPlayInfoGateway.kt
          grep -F 'api.snm0516.aisee.tv/x/tv/playurl' app/src/main/java/com/mytvb/feature/player/VideoPlayerPlayInfoGateway.kt
          grep -F 'app.bilibili.com/x/v2/playurl' app/src/main/java/com/mytvb/feature/player/VideoPlayerPlayInfoGateway.kt
          grep -F 'playinfo winner=android_app_api' app/src/main/java/com/mytvb/feature/player/VideoPlayerPlayInfoGateway.kt
          grep -F 'BiliDroid/7.66.0' app/src/main/java/com/mytvb/feature/player/VideoPlayerPlayInfoGateway.kt
          grep -F 'TV-API HTTP' app/src/main/java/com/mytvb/feature/player/VideoPlayerPlayInfoGateway.kt
          grep -F 'APP-API HTTP' app/src/main/java/com/mytvb/feature/player/VideoPlayerPlayInfoGateway.kt
          ! grep -F 'Bilibili Freedoooooom/MarkII' app/src/main/java/com/mytvb/feature/player/VideoPlayerPlayInfoGateway.kt
          grep -F 'media_http412 retry=native' app/src/main/java/com/mytvb/feature/player/VideoPlayerViewModel.kt
          grep -F 'MEDIA-CDN HTTP 412' app/src/main/java/com/mytvb/feature/player/PlaybackFallbackController.kt
          ! grep -F 'Chrome/119.0.0.0' app/src/main/java/com/mytvb/feature/player/VideoPlayerViewModel.kt

      - name: Verify Android 6 and armeabi-v7a release config unchanged
        run: |
          grep -F 'minSdk = 23' app/build.gradle.kts
          awk '/release \{/{flag=1} flag{print} /    \}/{if(flag){exit}}' app/build.gradle.kts | grep -F 'abiFilters += listOf("armeabi-v7a")'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Use preinstalled Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build 32-bit Release APK from Kotlin source
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleReleaseRenamed

      - name: Verify Release APK and checksum
        run: |
          APK='app/build/outputs/renamed_apk/release/MyTVB-v7a-v2.0.3-release.apk'
          test -f "$APK"
          ls -lh "$APK"

          echo 'Native ABI directories:'
          ABIS=$(unzip -l "$APK" | awk '/lib\/.+\.so$/ {split($4,a,"/"); print a[2]}' | sort -u)
          printf '%s\n' "$ABIS"
          test "$ABIS" = 'armeabi-v7a'

          sha256sum "$APK" | tee "$APK.sha256"

      - name: Upload Release APK
        uses: actions/upload-artifact@v6
        with:
          name: MyTVB-v2.0.3-v7a-release-app-playinfo-fallback
          path: |
            app/build/outputs/renamed_apk/release/MyTVB-v7a-v2.0.3-release.apk
            app/build/outputs/renamed_apk/release/MyTVB-v7a-v2.0.3-release.apk.sha256
          if-no-files-found: error
